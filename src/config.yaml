site:
  name: DX Tools
  site: 'https://dxtools.top'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: oLq7eFw0EbN9G7mIQ1ot5XvoS4spOPXHCRFovdNek2U

metadata:
  title:
    default: DX Tools by 莫说闲话
    template: '%s — DX Tools'
  description: "AI 产业观察、汽车科技、半导体投资、编程实践。by 莫说闲话。"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: DX Tools
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@iGaves'
    site: '@iGaves'
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 10

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
